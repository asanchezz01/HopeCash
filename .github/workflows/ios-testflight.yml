name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build and upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 45
    environment: testflight

    defaults:
      run:
        working-directory: app

    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      IOS_CERTIFICATE_PRIVATE_KEY: ${{ secrets.IOS_CERTIFICATE_PRIVATE_KEY }}
      BUNDLE_ID: br.com.newhope.hopecash
      # Re-runs keep run_number, so include run_attempt to avoid duplicate builds.
      IOS_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate Apple credentials
        run: |
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_KEY_IDENTIFIER"
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY"
          test -n "$IOS_CERTIFICATE_PRIVATE_KEY"

      # O CDN do CocoaPods entrega os podspecs por raw.githubusercontent.com, e
      # o IP compartilhado dos runners macOS estoura a cota de anônimo (429).
      # Guardar o índice do trunk e os downloads entre execuções derruba quase
      # todas essas requisições.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods/repos/trunk
            ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('app/pubspec.lock', 'app/ios/Podfile') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Install iOS dependencies
        run: |
          flutter pub get
          # O 429 do CDN é transitório: espera e tenta de novo antes de desistir.
          for attempt in 1 2 3; do
            if pod install --project-directory=ios; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::pod install falhou em $attempt tentativas" >&2
              exit 1
            fi
            delay=$((attempt * 30))
            echo "::warning::pod install falhou (tentativa $attempt). Nova tentativa em ${delay}s"
            sleep "$delay"
          done

      # Sem Podfile.lock no repositório, cada execução resolve as versões do
      # zero e busca muito mais podspec no CDN. Este artefato existe para que o
      # lock gerado aqui possa ser commitado (não há Mac no time).
      - name: Upload Podfile.lock
        uses: actions/upload-artifact@v4
        with:
          name: Podfile-lock-${{ env.IOS_BUILD_NUMBER }}
          path: app/ios/Podfile.lock
          if-no-files-found: warn
          retention-days: 14

      - name: Install App Store Connect tools
        run: |
          python3 -m venv "$RUNNER_TEMP/codemagic-cli"
          "$RUNNER_TEMP/codemagic-cli/bin/python" -m pip install \
            --disable-pip-version-check codemagic-cli-tools
          echo "$RUNNER_TEMP/codemagic-cli/bin" >> "$GITHUB_PATH"

      - name: Fetch signing files
        run: |
          certificate_key="$RUNNER_TEMP/ios_certificate_key.pem"
          printf '%s' "$IOS_CERTIFICATE_PRIVATE_KEY" > "$certificate_key"
          chmod 600 "$certificate_key"

          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key=@file:"$certificate_key" \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build signed IPA
        run: |
          flutter build ipa --release \
            --build-number="$IOS_BUILD_NUMBER" \
            --export-options-plist="$HOME/export_options.plist" \
            --dart-define=API_BASE_URL=https://api.hopecash.tech

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HopeCash-ios-${{ env.IOS_BUILD_NUMBER }}
          path: app/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        run: app-store-connect publish --path "$(find build/ios/ipa -name '*.ipa' -print -quit)"
