name: hopecash
description: "HopeCash — gestão financeira pessoal e familiar (NewHope)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Estado e navegação
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0

  # Banco local offline-first
  drift: ^2.28.0
  drift_flutter: ^0.2.7

  # Rede e sincronização
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Importação de extrato
  file_selector: ^1.0.3

  # Lançamento por voz (reconhecimento de fala nativo)
  speech_to_text: 7.5.0-beta.1
  just_audio: ^0.10.5

  # Segurança e utilidades
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  uuid: ^4.5.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  excel: ^4.0.6
  pdf: ^3.11.3
  share_plus: ^12.0.2

  # Notificações push (Firebase Cloud Messaging)
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
