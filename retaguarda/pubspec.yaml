name: hopecash_retaguarda
description: "HopeCash Retaguarda — painel administrativo do SaaS (NewHope)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Estado e navegação
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0

  # Rede (mesmo backend do app)
  dio: ^5.7.0

  # Sessão — shared_preferences (localStorage no web) funciona em contexto
  # inseguro (HTTP em IP), ao contrário do flutter_secure_storage, que exige
  # a Web Crypto API disponível apenas em HTTPS/localhost.
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
